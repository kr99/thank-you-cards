<!doctype html>
<meta charset="utf-8"><title>lanes4 demo</title>
<style>
body{background:#101216;color:#d8dde6;font:14px system-ui,sans-serif;margin:12px}
canvas{background:#181b22;border-radius:8px;max-width:100%;display:block}
#cv{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
.pane h3{margin:0 0 4px;font-size:14px;color:#8cf}
.st{font:12px monospace;color:#fc8;white-space:pre-wrap;min-height:3.2em;max-width:640px}
#panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
fieldset{border:1px solid #333a48;border-radius:6px;margin:0;padding:6px 10px}
legend{color:#8cf;padding:0 6px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0}
.row .n{width:46%}small{display:block;color:#7b8394;font-size:11px}
.row input[type=range]{flex:1;min-width:60px}output{min-width:44px;text-align:right;color:#8cf}
button,select{background:#252a35;color:#d8dde6;border:1px solid #444;border-radius:4px;padding:3px 8px}
#tout{min-width:56px}
</style>
<div id="panel"></div>
<div id="cv"></div>
<script src="./lanes4.js"></script>
<script>
var D = Lanes4.LANES4_DEFAULTS, TXT = 'THANK YOU ';
// [key, min, max, step, default, isPlanParam, label, help, group]
var SPEC = [
 ['R',1,8,1,3,0,'Rows','Grid height in cubes','Grid & timing'],
 ['C',3,30,1,14,0,'Columns','Grid width in cubes','Grid & timing'],
 ['seed',0,9999,1,7,0,'Random seed','Same seed + settings = same animation','Grid & timing'],
 ['T',2,20,0.5,D.T,0,'Total time (s)','Length of the whole shuffle, ending at the letter lock','Grid & timing'],
 ['K',1,12,1,D.K,1,'Number of shifts (rows, cols, rows...)','Shifts alternate rows then columns; more shifts = shorter, faster slides','Grid & timing'],
 ['GAP_P',0,0.5,0.01,D.GAP_P,1,'Gap chance per cell (0.15 = 15%)','Chance any cell is empty in a start/end layout','Gaps'],
 ['Q_FULL',0,1,0.01,D.Q_FULL,1,'Chance of a full-lane replace','Per lane per shift: whole lane slides out, a new one slides in','Gaps'],
 ['LAMBDA',0,1,0.05,D.LAMBDA,1,'Row/col similarity','0 = each lane scales by its own length; 1 = rows and columns move the same distance','Shift size'],
 ['CAP_ROW',0,3,0.1,D.CAP_ROW,1,'Max shift: rows (x lane length)','Largest row slide as a multiple of row length','Shift size'],
 ['CAP_COL',0,3,0.1,D.CAP_COL,1,'Max shift: columns (x lane length)','Above 1 = a column can be fully replaced','Shift size'],
 ['W_LO',0.1,2,0.05,D.W_LO,1,'Lane speed variety: min multiplier','Slowest lane scale vs average','Shift size'],
 ['W_HI',0.5,5,0.05,D.W_HI,1,'Lane speed variety: max multiplier','Fastest lane scale vs average','Shift size']
];
var V = {}, pairing = D.PAIRING, plans = [], cvs = [], sts = [], sums = [], t = 0, playing = true, last = performance.now();
var panel = document.getElementById('panel');
function fieldset(name) {
  var f = document.createElement('fieldset'), l = document.createElement('legend');
  l.textContent = name; f.append(l); panel.append(f); return f;
}
function row(label, help, ...els) {
  var r = document.createElement('div'), n = document.createElement('div');
  r.className = 'row'; r.title = help; n.className = 'n'; n.innerHTML = label + '<small>' + help + '</small>';
  r.append(n, ...els); return r;
}
var groups = {};
SPEC.forEach(function (s) {
  var g = groups[s[8]] = groups[s[8]] || fieldset(s[8]);
  var i = document.createElement('input'), o = document.createElement('output');
  i.type = 'range'; i.min = s[1]; i.max = s[2]; i.step = s[3]; i.id = 'p_' + s[0];
  i.oninput = function () { V[s[0]] = +i.value; o.textContent = i.value; build(); };
  o.id = 'o_' + s[0]; s.i = i; s.o = o;
  var els = [i, o];
  if (s[0] === 'seed') {
    var b = document.createElement('button'); b.id = 'reroll'; b.textContent = 'Reroll';
    b.onclick = function () { i.value = Math.floor(Math.random() * 10000); i.oninput(); }; els.push(b);
  }
  g.append(row(s[6], s[7], ...els));
});
// Style
var gs = fieldset('Style'), ps = document.createElement('select');
ps.id = 'pairing'; ['rigid', 'fresh'].forEach(function (v) { ps.add(new Option(v)); });
ps.onchange = function () { pairing = ps.value; build(); };
var cmp = document.createElement('input'); cmp.type = 'checkbox'; cmp.id = 'cmp'; cmp.onchange = build;
var rs = document.createElement('button'); rs.id = 'reset'; rs.textContent = 'Reset to defaults'; rs.onclick = setDefaults;
gs.append(row('Gap style', 'rigid: lane slides as a block; fresh: cubes reshuffle', ps),
  row('Compare', 'Two canvases, same seed: fresh vs rigid, one shared clock', cmp), row('Defaults', 'Restore every control', rs));
// Playback
var gp = fieldset('Playback'), play = document.createElement('button'), loop = document.createElement('input'),
  sp = document.createElement('select'), sc = document.createElement('input'), tout = document.createElement('output');
play.id = 'play'; play.textContent = 'Pause';
play.onclick = function () { playing = !playing; play.textContent = playing ? 'Pause' : 'Play'; if (playing && t >= V.T) t = 0; };
loop.type = 'checkbox'; loop.id = 'loop'; loop.checked = true;
sp.id = 'speed'; ['0.25', '0.5', '1', '1.5', '2'].forEach(function (v) { sp.add(new Option(v + 'x', v)); }); sp.value = '1';
sc.type = 'range'; sc.id = 'scrub'; sc.min = 0; sc.max = 1; sc.step = 0.001; sc.value = 0; sc.oninput = function () { t = +sc.value; };
tout.id = 'tout';
gp.append(row('Play / pause', 'Start or stop the clock', play), row('Loop', 'Restart when the animation ends', loop),
  row('Speed', 'Playback rate 0.25x to 2x', sp), row('Time (s)', 'Scrub to any moment', sc, tout));

function setDefaults() {
  SPEC.forEach(function (s) { s.i.value = s[4]; s.o.textContent = s[4]; V[s[0]] = s[4]; });
  pairing = ps.value = D.PAIRING; build();
}
function mk(pair) {
  var p = {}; SPEC.forEach(function (s) { if (s[5]) p[s[0]] = V[s[0]]; }); p.PAIRING = pair;
  return Lanes4.planLanes4({ R: V.R, C: V.C, T: V.T, seed: V.seed, params: p });
}
function build() {
  var pairs = cmp.checked ? ['fresh', 'rigid'] : [pairing], host = document.getElementById('cv');
  plans = pairs.map(mk); host.innerHTML = ''; cvs = []; sts = [];
  pairs.forEach(function (pr) {
    var w = document.createElement('div'), h = document.createElement('h3'), c = document.createElement('canvas'), st = document.createElement('div');
    w.className = 'pane'; h.textContent = 'Gap style: ' + pr; st.className = 'st';
    c.width = (Math.min(1100, V.C * 40 + 20) * (pairs.length > 1 ? 0.9 : 1)) | 0; c.height = V.R * 40 + 20;
    w.append(h, c, st); host.append(w); cvs.push(c); sts.push(st);
  });
  sc.max = V.T;
}
function draw(plan, c) {
  var g = c.getContext('2d'), cell = Math.min((c.width - 20) / plan.C, (c.height - 20) / plan.R),
    ox = (c.width - cell * plan.C) / 2, oy = (c.height - cell * plan.R) / 2, pad = cell * 0.06;
  g.clearRect(0, 0, c.width, c.height);
  g.strokeStyle = '#2c3140'; g.strokeRect(ox, oy, cell * plan.C, cell * plan.R);
  g.save(); g.beginPath(); g.rect(ox, oy, cell * plan.C, cell * plan.R); g.clip(); // partial-edge clip
  Lanes4.sampleLanes4(plan, t).forEach(function (q) {
    var x = ox + q.x * cell, y = oy + q.y * cell;
    g.fillStyle = q.stopped ? '#2a4a7a' : '#3a6fb0'; g.beginPath();
    g.roundRect(x + pad, y + pad, cell - 2 * pad, cell - 2 * pad, cell * 0.18); g.fill();
    if (q.stopped) {
      g.fillStyle = '#fff'; g.font = 'bold ' + (cell * 0.55 | 0) + 'px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(TXT[(Math.round(q.y) * plan.C + Math.round(q.x)) % TXT.length], x + cell / 2, y + cell / 2 + 1);
    }
  });
  g.restore();
}
function status(p, el) {
  var k = Math.min(p.K - 1, Math.floor(t / p.D)), st = p.steps[k], row = st.axis === 'row', pre = row ? 'R' : 'C';
  var still = 0, full = 0;
  var list = st.lanes.map(function (l) {
    if (l.s === 0) still++; else if (Math.abs(l.s) >= l.L) full++;
    var w = l.s === 0 ? '(still)' : row ? (l.s > 0 ? '(right)' : '(left)') : (l.s > 0 ? '(down)' : '(up)');
    return pre + l.index + ' ' + (l.s > 0 ? '+' : '') + l.s + ' ' + w;
  }).join(', ');
  el.textContent = 'Shift ' + (k + 1) + ' of ' + p.K + ': ' + (row ? 'rows' : 'columns') + ' | lane shifts: ' + list +
    '\nSummary: ' + st.lanes.length + ' lanes, ' + still + ' still, ' + (st.lanes.length - still) + ' moving, ' + full + ' full-replace';
}
function frame(now) {
  var dt = (now - last) / 1000; last = now;
  if (playing) {
    t += dt * +sp.value;
    if (t >= V.T) { if (loop.checked) t = 0; else { t = V.T; playing = false; play.textContent = 'Play'; } }
    sc.value = t;
  }
  tout.textContent = t.toFixed(2) + 's';
  plans.forEach(function (p, i) { draw(p, cvs[i]); status(p, sts[i]); });
  requestAnimationFrame(frame);
}
setDefaults(); requestAnimationFrame(frame);
</script>
